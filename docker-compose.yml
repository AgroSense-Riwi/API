x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  # SimpleAuthManager con login real: antes de arrancar cada componente se escribe el archivo
  # de contraseñas {usuario: contraseña} desde el entorno (json.dumps escapa cualquier carácter)
  # para que Airflow no genere contraseñas aleatorias ni las imprima en los logs.
  entrypoint:
    - /usr/bin/dumb-init
    - --
    - /bin/bash
    - -c
    - >-
      python -c 'import json, os;
      path = os.environ["AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE"];
      fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600);
      os.write(fd, (json.dumps({os.environ["AIRFLOW_ADMIN_USER"]: os.environ["AIRFLOW_ADMIN_PASSWORD"]}) + "\n").encode());
      os.close(fd)'
      && exec /entrypoint "$$@"
    - --
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${AIRFLOW_DB_NAME:-airflow_db}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?AIRFLOW__CORE__FERNET_KEY is required}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?AIRFLOW__WEBSERVER__SECRET_KEY is required}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?AIRFLOW__WEBSERVER__SECRET_KEY is required}
    # Sin ALL_ADMINS: cada acceso a la UI/API de Airflow requiere usuario y contraseña.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: ${AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE:-/tmp/simple_auth_manager_passwords.json}
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__WEBSERVER__SECRET_KEY:?AIRFLOW__WEBSERVER__SECRET_KEY is required}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Sin valores de relleno: vacías => boto3 usa su cadena de credenciales por defecto.
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
    S3_BUCKET: ${S3_BUCKET:-changeme}
  volumes:
    - ./pipelines/airflow/dags:/opt/airflow/dags:ro
    - ./pipelines/airflow/plugins:/opt/airflow/plugins:ro
    - airflow_logs_data:/opt/airflow/logs

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: agrosense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow_db}
      AGROSENSE_APP_DB_PASSWORD: ${AGROSENSE_APP_DB_PASSWORD:?AGROSENSE_APP_DB_PASSWORD is required}
    volumes:
      - pg_spatial_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - private_subnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  broker:
    image: rabbitmq:3.13-management-alpine
    container_name: agrosense_broker
    # Nombre de nodo fijo (rabbit@agrosense-rabbitmq, rabbitmq.md §5): sin él, cada vez que se
    # recrea el contenedor cambia el hostname y RabbitMQ arranca un nodo nuevo sobre el volumen.
    hostname: agrosense-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/agrosense}
    # Consola de administración en http://localhost:15672 (rabbitmq.md §6.1). Solo en loopback:
    # no queda expuesta a la red local. Publicar un puerto exige una red no interna (public_subnet).
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ./infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - iot_telemetry_queue_data:/var/lib/rabbitmq
    networks:
      - private_subnet
      - public_subnet
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: agrosense-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agrosense_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      AGROSENSE_DATABASE_URL: ${AGROSENSE_DATABASE_URL:?AGROSENSE_DATABASE_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AGROSENSE_RABBITMQ_URL: ${AGROSENSE_RABBITMQ_URL:?AGROSENSE_RABBITMQ_URL is required}
      AGROSENSE_JWT_SECRET_KEY: ${AGROSENSE_JWT_SECRET_KEY:?AGROSENSE_JWT_SECRET_KEY is required}
      AGROSENSE_BUYER_JWT_SECRET_KEY: ${AGROSENSE_BUYER_JWT_SECRET_KEY:?AGROSENSE_BUYER_JWT_SECRET_KEY is required}
      AGROSENSE_ALLOWED_ORIGINS: ${AGROSENSE_ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}
      # Usuario bootstrap opcional (ADMIN); el resto de operadores vive en la tabla users.
      AGROSENSE_AUTH_USERNAME: ${AGROSENSE_AUTH_USERNAME:-}
      AGROSENSE_AUTH_PASSWORD_HASH: ${AGROSENSE_AUTH_PASSWORD_HASH:-}
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
      S3_BUCKET: ${S3_BUCKET:-changeme}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - public_subnet
      - private_subnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # FastConsumer de telemetría (rabbitmq.md): consume telemetry.raw.queue con ACK manual.
  # Misma imagen que la API; en AWS corre como segundo contenedor de la tarea Fargate de la API.
  telemetry-consumer:
    image: agrosense-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: agrosense_telemetry_consumer
    restart: unless-stopped
    command: ["python", "-m", "agrosense_api.workers.telemetry_consumer"]
    environment:
      AGROSENSE_RABBITMQ_URL: ${AGROSENSE_RABBITMQ_URL:?AGROSENSE_RABBITMQ_URL is required}
      SKIP_MIGRATIONS: "true"
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - private_subnet

  simulators:
    image: agrosense-simulators:local
    build:
      context: .
      dockerfile: apps/simulators/Dockerfile
    container_name: agrosense_simulators
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${AGROSENSE_RABBITMQ_URL:?AGROSENSE_RABBITMQ_URL is required}
      SIMULATOR_MODE: ${SIMULATOR_MODE:-dev}
      SIMULATOR_FARMS_COUNT: ${SIMULATOR_FARMS_COUNT:-300}
      SEED_VALUE: ${SEED_VALUE:-42}
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - private_subnet

  airflow-init:
    <<: *airflow-common
    container_name: agrosense_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_subnet
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: agrosense_airflow_webserver
    command: api-server
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - public_subnet
      - private_subnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: agrosense_airflow_scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - public_subnet
      - private_subnet
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: agrosense_airflow_dag_processor
    command: dag-processor
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - private_subnet

networks:
  public_subnet:
    name: agrosense_public_subnet
    driver: bridge
  private_subnet:
    name: agrosense_private_subnet
    driver: bridge
    internal: true

volumes:
  pg_spatial_data:
    name: pg_spatial_data
  iot_telemetry_queue_data:
    name: iot_telemetry_queue_data
  airflow_logs_data:
    name: airflow_logs_data
