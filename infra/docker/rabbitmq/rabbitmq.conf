loopback_users.guest = false
listeners.tcp.default = 5672
management.tcp.port = 15672
## definitions.json NO se importa al arranque: cuando hay definiciones configuradas, RabbitMQ
## omite crear el usuario/vhost por defecto (RABBITMQ_DEFAULT_USER/PASS/VHOST) y el broker
## quedaría sin credenciales. La API y el FastConsumer declaran la misma topología de forma
## idempotente al conectarse. Importación manual opcional (vhost /agrosense):
##   docker compose exec broker rabbitmqctl import_definitions /etc/rabbitmq/definitions.json
## management.load_definitions = /etc/rabbitmq/definitions.json
## Límite de memoria seguro para desarrollo local
vm_memory_high_watermark.relative = 0.6
