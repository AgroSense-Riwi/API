# ==============================================================================
# AgroSense Café — CI/CD Pipeline: Build → Push ECR → Deploy ECS Fargate
# ==============================================================================
# Dispara en push a 'main' o manualmente.
#
# GitHub Secrets necesarios (ver infra/aws/setup-ecs-infra.sh para valores):
#   AWS_ACCESS_KEY_ID       - IAM access key con permisos ECR + ECS
#   AWS_SECRET_ACCESS_KEY   - IAM secret key
#   AWS_ACCOUNT_ID          - ID de cuenta de AWS (12 dígitos)
#   AWS_REGION              - Región (e.g. us-east-1)
#   ECS_CLUSTER             - Nombre del cluster ECS (agrosense-cluster)
#   ECS_SERVICE_API         - Nombre del servicio ECS de la API
#   SUBNET_1                - ID de subnet privada 1
#   SUBNET_2                - ID de subnet privada 2
#   API_SG                  - Security Group de la API
#   ALB_TG_ARN              - ARN del Target Group del ALB
# ==============================================================================

name: Deploy to ECS Fargate

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Forzar despliegue sin CI checks"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REPOSITORY: agrosense-api
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  id-token: write
  contents: read

jobs:
  # ─── Job 1: Calidad de código (reutiliza CI existente) ────────────────────
  quality:
    if: ${{ github.event.inputs.force_deploy != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync --locked --all-packages
      - run: uv run pre-commit run --all-files
      - run: uv run pytest

  # ─── Job 2: Escaneo de secretos ──────────────────────────────────────────
  secrets-scan:
    if: ${{ github.event.inputs.force_deploy != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar y ejecutar Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /tmp
          /tmp/gitleaks git --verbose --redact

  # ─── Job 3: Build Docker image → Push a ECR ──────────────────────────────
  build-and-push:
    needs: [quality, secrets-scan]
    if: |
      always() &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped') &&
      (needs.secrets-scan.result == 'success' || needs.secrets-scan.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push de imagen Docker
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          IMAGE_LATEST="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          echo "Building image: ${IMAGE_URI}"

          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE_URI}" \
            -t "${IMAGE_LATEST}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "${IMAGE_LATEST}" \
            .

          docker push "${IMAGE_URI}"
          docker push "${IMAGE_LATEST}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "✅ Image pushed: ${IMAGE_URI}"

  # ─── Job 4: Deploy a ECS Fargate ─────────────────────────────────────────
  deploy:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Preparar Task Definition
        id: task-def
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${COMMIT_SHA}"
          echo "Using IMAGE_URI: ${IMAGE_URI}"

          # Asegurar que el Log Group de CloudWatch exista para evitar AccessDenied en logs:CreateLogGroup
          aws logs create-log-group --log-group-name "/ecs/agrosense-api" --region "${AWS_REGION}" 2>/dev/null || true

          # Reemplazar variables base en el JSON
          sed -e "s|\${AWS_ACCOUNT_ID}|${ACCOUNT_ID}|g" \
              -e "s|\${AWS_REGION}|${AWS_REGION}|g" \
              infra/aws/ecs/task-definition-api.json > /tmp/task-def-base.json

          # Resolver dinámicamente ARNs canónicos de Secrets Manager (incluye el sufijo aleatorio de 6 caracteres)
          cp /tmp/task-def-base.json /tmp/task-def-resolved.json
          SECRET_COUNT=$(jq '.containerDefinitions[0].secrets | length' /tmp/task-def-resolved.json)
          for ((i=0; i<SECRET_COUNT; i++)); do
            VALUE_FROM=$(jq -r ".containerDefinitions[0].secrets[$i].valueFrom" /tmp/task-def-resolved.json)
            SECRET_NAME=$(echo "$VALUE_FROM" | sed -E 's/.*:secret:([^:]+).*/\1/')
            REAL_ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --region "${AWS_REGION}" --query ARN --output text 2>/dev/null || echo "")
            if [ -n "$REAL_ARN" ]; then
              echo "ARN resuelto para $SECRET_NAME: $REAL_ARN"
              jq --arg idx "$i" --arg arn "$REAL_ARN" \
                '.containerDefinitions[0].secrets[($idx | tonumber)].valueFrom = $arn' \
                /tmp/task-def-resolved.json > /tmp/task-def-tmp.json && mv /tmp/task-def-tmp.json /tmp/task-def-resolved.json
            else
              echo "Manteniendo ARN existente para $SECRET_NAME: $VALUE_FROM"
            fi
          done

          jq --arg img "${IMAGE_URI}" \
             '.containerDefinitions[0].image = $img' \
             /tmp/task-def-resolved.json > /tmp/task-def-api.json

          echo "Task definition verificada:"
          jq '.containerDefinitions[0].image, .containerDefinitions[0].secrets' /tmp/task-def-api.json

      - name: Registrar Task Definition en ECS
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-def-api.json \
            --region "${AWS_REGION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=${TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"
          echo "✅ Task Definition registrada: ${TASK_DEF_ARN}"

      - name: Crear o actualizar ECS Service
        env:
          TASK_DEF_ARN: ${{ steps.register-task.outputs.task_def_arn }}
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE_API }}
        run: |
          # Verificar si el servicio ya existe
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${AWS_REGION}" \
            --query 'services[?status==`ACTIVE`].serviceName' \
            --output text 2>/dev/null || echo "")

          if [ -n "${SERVICE_EXISTS}" ]; then
            echo "Actualizando servicio existente..."
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${SERVICE}" \
              --task-definition "${TASK_DEF_ARN}" \
              --force-new-deployment \
              --region "${AWS_REGION}" \
              --query 'service.serviceName' \
              --output text
          else
            echo "Creando nuevo servicio ECS..."
            aws ecs create-service \
              --cluster "${CLUSTER}" \
              --service-name "${SERVICE}" \
              --task-definition "${TASK_DEF_ARN}" \
              --desired-count 1 \
              --launch-type FARGATE \
              --deployment-configuration "minimumHealthyPercent=50,maximumPercent=200" \
              --load-balancers "targetGroupArn=arn:aws:elasticloadbalancing:${AWS_REGION}:${ACCOUNT_ID}:targetgroup/agrosense-api-tg/9b9868b5424fbeb5,containerName=agrosense-api,containerPort=8000" \
              --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNET_1 }},${{ secrets.SUBNET_2 }}],securityGroups=[${{ secrets.API_SG }}],assignPublicIp=DISABLED}" \
              --region "${AWS_REGION}" \
              --query 'service.serviceName' \
              --output text
          fi

          echo "✅ Servicio ECS desplegado."

      - name: Esperar estabilización del servicio
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE_API }}
        run: |
          echo "Esperando a que el servicio se estabilice (máx 10 min)..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${AWS_REGION}"
          echo "✅ Servicio estabilizado y operativo."

      - name: Diagnóstico detallado en caso de fallo en ECS
        if: failure()
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE_API }}
        run: |
          echo "::error::El servicio ECS no se estabilizó. Mostrando eventos y razones de fallo..."
          echo "=== Últimos 15 eventos del servicio ECS ==="
          aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${AWS_REGION}" \
            --query "services[0].events[0:15].[createdAt,message]" \
            --output table || true

          echo "=== Tareas detenidas recientemente y causas de salida ==="
          STOPPED_TASKS=$(aws ecs list-tasks \
            --cluster "${CLUSTER}" \
            --service-name "${SERVICE}" \
            --desired-status STOPPED \
            --region "${AWS_REGION}" \
            --query "taskArns[0:5]" \
            --output text 2>/dev/null || echo "")

          if [ -n "${STOPPED_TASKS}" ]; then
            aws ecs describe-tasks \
              --cluster "${CLUSTER}" \
              --tasks ${STOPPED_TASKS} \
              --region "${AWS_REGION}" \
              --query "tasks[*].[taskArn,stopCode,stoppedReason,containers[0].[name,exitCode,reason]]" \
              --output table || true
          fi

      - name: Verificar Health Check
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE_API }}
        run: |
          RUNNING=$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${AWS_REGION}" \
            --query 'services[0].runningCount' \
            --output text)

          DESIRED=$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${AWS_REGION}" \
            --query 'services[0].desiredCount' \
            --output text)

          echo "Running: ${RUNNING} / Desired: ${DESIRED}"

          if [ "${RUNNING}" -eq "${DESIRED}" ]; then
            echo "✅ Despliegue exitoso. ${RUNNING} tasks corriendo."
          else
            echo "⚠️ Despliegue parcial: ${RUNNING}/${DESIRED} tasks activas."
            exit 1
          fi

      - name: Resumen del despliegue
        if: success()
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ✅ AgroSense API desplegada en ECS Fargate     ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  Cluster:  ${{ secrets.ECS_CLUSTER }}"
          echo "║  Service:  ${{ secrets.ECS_SERVICE_API }}"
          echo "║  URL ALB:  http://agrosense-alb-573972328.us-east-2.elb.amazonaws.com"
          echo "║  Image:    ${{ needs.build-and-push.outputs.image_uri }}"
          echo "║  Commit:   ${{ github.sha }}"
          echo "╚══════════════════════════════════════════════════╝"
