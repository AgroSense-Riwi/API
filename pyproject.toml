[project]
name = "agrosense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.workspace]
members = ["apps/*"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "faker>=40.43.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # S = reglas de seguridad (bandit)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607"]       # permite assert y llamadas a subprocess en pruebas
"scripts/seed/**" = ["S311"]                   # PRNG estándar requerido para simulación determinista (no criptográfica)
"apps/simulators/**" = ["S311"]               # PRNG para simulación de telemetría IoT física

[tool.pytest.ini_options]
testpaths = ["apps", "tests"]
pythonpath = [".", "apps/api/src", "apps/simulators/src"]
addopts = "--cov=apps --cov=scripts --cov-report=term-missing"
