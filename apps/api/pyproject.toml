[project]
name = "agrosense-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lians", email = "paterninalopezlians@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5",
    "aiosqlite>=0.21",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "fastapi[standard]>=0.142.2",
    "geoalchemy2>=0.18",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agrosense-api = "agrosense_api:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
]
