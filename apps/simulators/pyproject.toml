[project]
name = "agrosense-simulators"
version = "0.1.0"
description = "IoT Sensor Simulator with Block/Burst Transmission for AgroSense Café (AGRO-15 / EP-05)"
readme = "README.md"
authors = [
    { name = "AgroSense Team", email = "dev@agrosense.local" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=24.0.0",
    "numpy>=1.26.0",
    "pika>=1.3.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
agrosense-simulators = "agrosense_simulators.main:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
